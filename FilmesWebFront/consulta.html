<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Filmes - FilmesWeb</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="navbar">
    <div class="logo">
        <i class="fa-solid fa-film"></i>
        <span>FilmesWeb</span>
    </div>
    <nav class="nav-links">
        <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Início</a>
        <a href="consulta.html" class="nav-btn active"><i class="fa-solid fa-magnifying-glass"></i> Consultar</a>
        <a href="cadastro.html" class="nav-btn"><i class="fa-solid fa-plus"></i> Novo Filme</a>
    </nav>
</header>

<main class="container">
    <div class="page-header">
        <h2><i class="fa-solid fa-list"></i> Catálogo de Filmes</h2>
        <p>Filtre e pesquise por títulos, gêneros e avaliações.</p>
    </div>

    <div class="search-bar-container">
        <div class="input-group">
            <i class="fa-solid fa-search search-icon"></i>
            <input type="text" id="inputBusca" placeholder="Pesquisar por título...">
        </div>
        <select id="filtroGenero">
            <option value="">Todos os Gêneros</option>
            <option value="Ação">Ação</option>
            <option value="Aventura">Aventura</option>
            <option value="Comédia">Comédia</option>
            <option value="Drama">Drama</option>
            <option value="Ficção Científica">Ficção Científica</option>
            <option value="Terror">Terror</option>
        </select>
        <button class="btn btn-primary" id="btnBuscar"><i class="fa-solid fa-filter"></i> Filtrar</button>
    </div>

    <div id="gridFilmes" class="grid-filmes"></div>

    <div id="mensagemVazia" class="mensagem-vazia" style="display: none;">
        <i class="fa-regular fa-folder-open"></i>
        <p>Nenhum filme localizado no catálogo.</p>
    </div>
</main>

<script src="js/consultaController.js"></script>
</body>
</html>
