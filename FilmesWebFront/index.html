<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmesWeb - CineManager</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="navbar">
    <div class="logo">
        <i class="fa-solid fa-film"></i>
        <span>FilmesWeb</span>
    </div>
    <nav class="nav-links">
        <a href="index.html" class="nav-btn active"><i class="fa-solid fa-house"></i> Início</a>
        <a href="consulta.html" class="nav-btn"><i class="fa-solid fa-magnifying-glass"></i> Consultar</a>
        <a href="cadastro.html" class="nav-btn"><i class="fa-solid fa-plus"></i> Novo Filme</a>
    </nav>
</header>

<main class="container">
    <!-- HERO SECTION -->
    <section class="hero-banner">
        <div class="hero-text">
            <h1>Gerencie seu Acervo do Cinema</h1>
            <p>Cadastre, pesquise, avalie e acompanhe seus filmes favoritos em uma única plataforma interativa.</p>
            <div class="hero-actions">
                <a href="consulta.html" class="btn btn-primary"><i class="fa-solid fa-compass"></i> Explorar Catálogo</a>
                <a href="cadastro.html" class="btn btn-success"><i class="fa-solid fa-clapperboard"></i> Cadastrar Filme</a>
            </div>
        </div>
    </section>

    <!-- DASHBOARD METRICS -->
    <!-- Seção de Métricas / Contadores -->
    <!-- Seção de Métricas / Contadores (Com Ícones) -->
    <section class="dashboard-stats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px;">
        <!-- Card 1: Filmes Cadastrados -->
        <div class="stat-card" style="background-color: #1e293b; padding: 20px; border-radius: 10px; display: flex; align-items: center; gap: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);">
            <div class="stat-icon" style="background-color: rgba(59, 130, 246, 0.2); color: #3b82f6; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem;">
                <i class="fas fa-film"></i>
            </div>
            <div class="stat-info">
                <h3 style="margin: 0; font-size: 0.9rem; color: #94a3b8; font-weight: 500;">Filmes Cadastrados</h3>
                <p id="totalFilmes" class="stat-number" style="margin: 5px 0 0 0; font-size: 1.8rem; font-weight: bold; color: #f8fafc;">0</p>
            </div>
        </div>

        <!-- Card 2: Gêneros Ativos -->
        <div class="stat-card" style="background-color: #1e293b; padding: 20px; border-radius: 10px; display: flex; align-items: center; gap: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);">
            <div class="stat-icon" style="background-color: rgba(168, 85, 247, 0.2); color: #a855f7; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem;">
                <i class="fas fa-tags"></i>
            </div>
            <div class="stat-info">
                <h3 style="margin: 0; font-size: 0.9rem; color: #94a3b8; font-weight: 500;">Gêneros Ativos</h3>
                <p id="totalGeneros" class="stat-number" style="margin: 5px 0 0 0; font-size: 1.8rem; font-weight: bold; color: #f8fafc;">0</p>
            </div>
        </div>
    </section>

    <!-- Seção Adicionados Recentemente -->
    <section class="recent-movies">
        <h2 style="font-size: 1.4rem; margin-bottom: 20px; color: #f8fafc;">Adicionados Recentemente</h2>
        <div id="gridRecentes" class="grid-filmes" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;">
            <!-- Os cards serão inseridos dinamicamente pelo JS -->
        </div>
    </section>
</main>
<!-- Modal de Detalhes -->
<div id="modalDetalhes" class="modal-overlay" style="display: none;">
    <div class="modal-conteudo">
        <button id="btnFecharModal" class="modal-fechar">&times;</button>
        <div class="modal-body">
            <img id="modalCapa" src="" alt="Pôster do Filme" class="modal-capa">
            <div class="modal-info">
                <h2 id="modalTitulo"></h2>
                <div class="modal-meta">
                    <span id="modalGenero" class="badge-genero"></span>
                </div>
                <p id="modalAno" style="margin-top: 12px; color: #cbd5e1;"></p>
            </div>
        </div>
    </div>
</div>

<script src="js/indexController.js"></script>
</body>
</html>
