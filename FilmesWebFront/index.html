<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmesWeb - CineManager</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="navbar">
    <div class="logo">
        <i class="fa-solid fa-film"></i>
        <span>FilmesWeb</span>
    </div>
    <nav class="nav-links">
        <a href="index.html" class="nav-btn active"><i class="fa-solid fa-house"></i> Início</a>
        <a href="consulta.html" class="nav-btn"><i class="fa-solid fa-magnifying-glass"></i> Consultar</a>
        <a href="cadastro.html" class="nav-btn"><i class="fa-solid fa-plus"></i> Novo Filme</a>
    </nav>
</header>

<main class="container">
    <!-- HERO SECTION -->
    <section class="hero-banner">
        <div class="hero-text">
            <h1>Gerencie seu Acervo do Cinema</h1>
            <p>Cadastre, pesquise, avalie e acompanhe seus filmes favoritos em uma única plataforma interativa.</p>
            <div class="hero-actions">
                <a href="consulta.html" class="btn btn-primary"><i class="fa-solid fa-compass"></i> Explorar Catálogo</a>
                <a href="cadastro.html" class="btn btn-success"><i class="fa-solid fa-clapperboard"></i> Cadastrar Filme</a>
            </div>
        </div>
    </section>

    <!-- DASHBOARD METRICS -->
    <section class="stats-grid">
        <div class="stat-card">
            <i class="fa-solid fa-video stat-icon"></i>
            <div>
                <h3 id="statTotalFilmes">0</h3>
                <p>Filmes Cadastrados</p>
            </div>
        </div>
        <div class="stat-card">
            <i class="fa-solid fa-star stat-icon"></i>
            <div>
                <h3 id="statMediaNota">0.0</h3>
                <p>Média de Avaliação</p>
            </div>
        </div>
        <div class="stat-card">
            <i class="fa-solid fa-layer-group stat-icon"></i>
            <div>
                <h3 id="statTotalGeneros">0</h3>
                <p>Gêneros Ativos</p>
            </div>
        </div>
    </section>

    <!-- FILMES EM DESTAQUE -->
    <section class="secao-destaques">
        <h2><i class="fa-solid fa-fire"></i> Adicionados Recentemente</h2>
        <div id="gridDestaques" class="grid-filmes">
            <!-- Carregado dinamicamente via JS -->
        </div>
    </section>
</main>

<script src="js/consultaController.js"></script>
</body>
</html>
