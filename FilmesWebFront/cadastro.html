<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Filme - FilmesWeb</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="navbar">
    <div class="logo">
        <i class="fa-solid fa-film"></i>
        <span>FilmesWeb</span>
    </div>
    <nav class="nav-links">
        <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Início</a>
        <a href="consulta.html" class="nav-btn"><i class="fa-solid fa-magnifying-glass"></i> Consultar</a>
        <a href="cadastro.html" class="nav-btn active"><i class="fa-solid fa-plus"></i> Novo Filme</a>
    </nav>
</header>

<main class="container">
    <div class="card-form">
        <h2 id="tituloForm"><i class="fa-solid fa-clapperboard"></i> Cadastrar Novo Filme</h2>
        <form id="formFilme" enctype="multipart/form-data">
            <!-- Campo oculto se precisar manipular id -->
            <input type="hidden" id="filmeId" value="">

            <!-- Título do Filme -->
            <div class="form-group">
                <label for="titulo">Título *</label>
                <input type="text" id="titulo" name="titulo" required placeholder="Digite o título do filme">
            </div>

            <!-- Ano de Lançamento -->
            <div class="form-group">
                <label for="ano">Ano *</label>
                <input type="number" id="ano" name="ano" required placeholder="Ex: 2024" min="1800" max="2100">
            </div>

            <!-- Gênero -->
            <div class="form-group">
                <label for="genero">Gênero *</label>
                <select id="genero" name="genero" required>
                    <option value="">Carregando gêneros...</option>
                </select>
            </div>

            <!-- Upload do Pôster (.jpg / .jpeg) -->
            <div class="form-group">
                <label for="fotoInput">Pôster do Filme (.jpg / .jpeg) *</label>
                <input type="file" id="fotoInput" name="poster" accept=".jpg,.jpeg,image/jpeg" required>
            </div>

            <!-- Pré-visualização da Imagem -->
            <div class="form-group preview-container" style="text-align: center; margin-top: 15px;">
                <img id="imagePreview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='225' viewBox='0 0 150 225' fill='%231e293b'><rect width='150' height='225'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%2394a3b8' font-family='sans-serif' font-size='14'>Prévia da Capa</text></svg>"
                     alt="Prévia do Pôster"
                     style="max-width: 150px; max-height: 225px; border-radius: 6px; object-fit: cover; border: 1px solid #334155;">
            </div>

            <!-- Botões de Ação -->
            <div class="form-acoes" style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="submit" class="btn btn-primary">Salvar Filme</button>
                <a href="consulta.html" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<script src="js/cadastroController.js"></script>
</body>
</html>
