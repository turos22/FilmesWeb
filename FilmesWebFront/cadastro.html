<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Filme - FilmesWeb</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="navbar">
    <div class="logo">
        <i class="fa-solid fa-film"></i>
        <span>FilmesWeb</span>
    </div>
    <nav class="nav-links">
        <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Início</a>
        <a href="consulta.html" class="nav-btn"><i class="fa-solid fa-magnifying-glass"></i> Consultar</a>
        <a href="cadastro.html" class="nav-btn active"><i class="fa-solid fa-plus"></i> Novo Filme</a>
    </nav>
</header>

<main class="container">
    <div class="card-form">
        <h2 id="tituloForm"><i class="fa-solid fa-clapperboard"></i> Cadastrar Novo Filme</h2>
        <form id="formFilme">
            <input type="hidden" id="filmeId">

            <div class="form-group">
                <label for="titulo">Título do Filme *</label>
                <input type="text" id="titulo" placeholder="Ex: Interstellar" required>
                <span class="erro-validacao" id="erroTitulo"></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="genero">Gênero *</label>
                    <select id="genero" required>
                        <option value="">Selecione...</option>
                        <option value="Ação">Ação</option>
                        <option value="Aventura">Aventura</option>
                        <option value="Comédia">Comédia</option>
                        <option value="Drama">Drama</option>
                        <option value="Ficção Científica">Ficção Científica</option>
                        <option value="Terror">Terror</option>
                    </select>
                    <span class="erro-validacao" id="erroGenero"></span>
                </div>

                <div class="form-group">
                    <label for="ano">Ano de Lançamento *</label>
                    <input type="number" id="ano" min="1888" max="2030" placeholder="Ex: 2014" required>
                    <span class="erro-validacao" id="erroAno"></span>
                </div>

                <div class="form-group">
                    <label for="nota">Nota (0 a 10)</label>
                    <input type="number" id="nota" step="0.1" min="0" max="10" placeholder="Ex: 8.6">
                    <span class="erro-validacao" id="erroNota"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="sinopse">Sinopse</label>
                <textarea id="sinopse" rows="3" placeholder="Insira o resumo do enredo..."></textarea>
            </div>

            <div class="form-group">
                <label for="fotoInput">Capa do Filme (Arquivo de Imagem)</label>
                <input type="file" id="fotoInput" accept="image/*">
                <div class="preview-container">
                    <img id="imagePreview" src="https://via.placeholder.com/150x220?text=Capa+do+Filme" alt="Pré-visualização da capa">
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="limparFormulario()">Limpar</button>
                <button type="submit" class="btn btn-success"><i class="fa-solid fa-floppy-disk"></i> Salvar Filme</button>
            </div>
        </form>
    </div>
</main>

<script src="js/cadastroController.js"></script>
</body>
</html>
