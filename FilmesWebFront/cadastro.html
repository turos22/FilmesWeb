<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cadastroController.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes Web .:Cadastro</title>
</head>

<body>
    <div class="container mt-3">
        <nav class="navbar navbar-expand-sm bg-light justify-content-end">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">go to Home</a>
                </li>
            </ul>
        </nav>
        <h2>Novo Filme</h2>
        <form id="ffilme">
            <div class="mb-3 mt-3">
                <label for="titulo">Titulo</label>
                <input type="text" class="form-control" name="titulo" id="titulo" />
            </div>
            <div class="mb-3 mt-3">
                <label for="ano">Ano</label>
                <input type="number" class="form-control" value="1990" name="ano" id="ano" />
            </div>
            <label for="genero">Genero</label>
            <!-- deve carregar as opções através do endpoint -->
            <select class="form-select" name="genero" id="genero">
                <option>Ação</option>
                <option>Aventura</option>
                <option>Comédia</option>
                <option>Terror</option>
                <option>Drama</option>
                <option>Ficção Científica"</option>
                <option>Fantasia</option>
                <option>Romance</option>
                <option>Documentário</option>
                <option>Animação</option>
                <option>Thriller</option>
                <option>Crime</option>
                <option>Comédia Romance</option>
                <option>Musical</option>
            </select>
            <div class="mb-3 mt-3">
                <label for="poster">Poster</label>
                <input type="file" class="form-control" name="poster" id="poster">
            </div>
        </form>
        <button class="btn btn-outline-primary" onclick="cadastrarFilmePoster()">Cadastrar</button>
</body>

</html>
